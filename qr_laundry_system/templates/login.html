<!DOCTYPE html>
<html>
<head>
    <title>Login - Smart Hostel Laundry</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to bottom right, #28a745, #007bff);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background: rgba(255,255,255,0.95);
            color: #333;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #007bff;
            text-shadow: 1px 1px #fff;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1em;
        }

        button {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            background: #28a745;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
        }

        button:hover { background: #007bff; }

        p { margin-top: 15px; }

        a {
            color: #007bff;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

    </style>
</head>
<body>

<div class="container">
    <h1>Login</h1>
    <form action="/login" method="POST">
        <input type="text" name="username" placeholder="Username" required><br>
        <input type="password" name="password" placeholder="Password" required><br>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="/register">Register Here</a></p>
</div>

</body>
</html>
